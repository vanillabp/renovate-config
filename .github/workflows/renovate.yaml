name: Renovate
"on":
  # NO SCHEDULE while the hosted Mend app is installed on this organisation. Two Renovate
  # instances on one repository use the same 'renovate/*' branches and the same dependency
  # dashboard, so whichever runs last overwrites the other. Until it is decided which of the
  # two stays, this workflow starts only when somebody asks it to.
  #
  # The schedule this had, for putting it back: 'cron: "0 1 * * *"'. 01:00 UTC is 03:00 in
  # Europe/Vienna during summer time, which puts the Monday run inside the window the preset
  # allows a pull request in.
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Report what would happen, create and change nothing"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Renovate does not run itself for these repositories: the hosted app of Mend asks for an
  # account there, this asks for a token. The token is what we can scope, rotate and see the
  # log of, so this is the half we own.
  #
  # It processes the whole organisation, not this repository. What a repository gets is
  # decided by its own renovate.json, which extends the preset next to this workflow; a
  # repository without one is skipped (see self-hosted.js).
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: self-hosted.js
          # A token with 'repo' AND 'workflow': without the second scope Renovate can read
          # a workflow file that pins an outdated action but not fix it, which is how
          # actions/setup-python@v5 survived on Node 20 in four workflows.
          token: "${{ secrets.RENOVATE_TOKEN }}"
        env:
          # 'full' logs every decision without writing anything - the first run of a new
          # setup, and the way to answer "why did it not propose that" later.
          RENOVATE_DRY_RUN: "${{ inputs.dryRun && 'full' || '' }}"
